version: '3.8'

networks:
  n8n-network:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      
      # ─── TIME OUT OVERRIDES TO FIX THE ERROR ───
      - N8N_RUNNERS_MODE=internal            # Forces n8n to execute processes inside the main engine
      - N8N_AI_TIMEOUT=3600000               # Gives AI calls a 1-hour window if needed
      - N8N_RUNNERS_TASK_TIMEOUT=300         # Extends the background task limit to 5 minutes
      
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - n8n-network
    depends_on:
      - n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
