version: '3.8'

networks:
  n8n-network:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      - n8n-network
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Kolkata # Keeps your automation cron-jobs accurate
      - TZ=Asia/Kolkata
      # ADD THESE TWO LINES TO FIX THE AI CHAT TIMEOUT:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_AI_TIMEOUT=300000  # Increases timeout to 5 minutes
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - n8n-network
    depends_on:
      - n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
