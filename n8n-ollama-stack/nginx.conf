worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # --- Basic rate limiting to slow down brute-force / abuse ---
    limit_req_zone $binary_remote_addr zone=n8n_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Hide nginx version
    server_tokens off;

    # Redirect all HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # --- TLS ---
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        client_max_body_size 50M;

        # --- Extra layer of auth in front of n8n's own login (defense in depth) ---
        auth_basic           "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req   zone=n8n_limit burst=20 nodelay;
        limit_conn  addr 20;

        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;

            # Needed for n8n's websocket-based editor UI
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
        }
    }

    # ---------------------------------------------------------------------
    # NOTE: Ollama is intentionally NOT proxied here. It stays on the
    # internal "backend" network and is only reachable from n8n, not from
    # the outside world. If you truly need to expose it (e.g. for another
    # local app), add a separate server block, keep it on a non-standard
    # port, and put auth_basic + IP allow-listing on it too.
    # ---------------------------------------------------------------------
}
